<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Goings On</title>
  <style>
    :root {
      --bg: #f5f5f7;
      --surface: #ffffff;
      --text: #1d1d1f;
      --text-secondary: #86868b;
      --text-tertiary: #a1a1a6;
      --accent: #0071e3;
      --accent-soft: #e8f1fd;
      --divider: rgba(0, 0, 0, 0.08);
      --shadow: 0 1px 3px rgba(0,0,0,0.04), 0 8px 24px rgba(0,0,0,0.04);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      font-feature-settings: 'kern', 'liga';
    }

    body {
      min-height: 100vh;
      padding: 2rem 1.25rem 4rem;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 720px;
    }

    .brand {
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--text-secondary);
      margin-bottom: 2.5rem;
      text-align: center;
    }

    .tabs {
      display: flex;
      gap: 0.4rem;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      padding: 0.25rem 0 1rem;
      margin: 0 -0.25rem 2rem;
      scrollbar-width: none;
    }
    .tabs::-webkit-scrollbar { display: none; }

    .tab {
      flex: 1 0 auto;
      min-width: 64px;
      background: var(--surface);
      border: none;
      border-radius: 14px;
      padding: 0.7rem 0.5rem 0.6rem;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      font-family: inherit;
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.03);
    }

    .tab:hover { transform: translateY(-1px); }

    .tab.active {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 4px 14px rgba(0, 113, 227, 0.32);
    }

    .tab-day {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--text-secondary);
    }

    .tab.active .tab-day { color: rgba(255,255,255,0.85); }

    .tab-num {
      font-size: 1.15rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .tab-badge {
      font-size: 0.62rem;
      font-weight: 600;
      color: var(--accent);
      margin-top: 1px;
    }
    .tab.active .tab-badge { color: rgba(255,255,255,0.85); }
    .tab.no-events .tab-badge { color: var(--text-tertiary); }

    .day-panel {
      animation: fadeIn 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .day-heading {
      margin-bottom: 1.75rem;
    }

    .day-eyebrow {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--accent);
      letter-spacing: -0.01em;
      margin-bottom: 0.3rem;
    }

    .day-title {
      font-size: 2.5rem;
      font-weight: 700;
      letter-spacing: -0.035em;
      line-height: 1.05;
      color: var(--text);
    }

    .day-subtitle {
      font-size: 1.1rem;
      font-weight: 500;
      color: var(--text-secondary);
      letter-spacing: -0.01em;
      margin-top: 0.35rem;
    }

    .events-list {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .event {
      background: var(--surface);
      border-radius: 16px;
      padding: 1.05rem 1.2rem;
      box-shadow: var(--shadow);
      display: flex;
      align-items: flex-start;
      gap: 1rem;
      transition: background-color 0.4s ease, box-shadow 0.4s ease, transform 0.15s ease;
      scroll-margin-top: 1rem;
    }

    .event:hover { transform: scale(1.005); }

    .event.highlight {
      background: var(--accent-soft);
      box-shadow: 0 0 0 3px rgba(0, 113, 227, 0.45), var(--shadow);
    }

    .event-map {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      margin-top: 0.55rem;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--accent);
      text-decoration: none;
      padding: 5px 10px;
      border-radius: 8px;
      background: var(--accent-soft);
      transition: background 0.15s ease;
    }

    .event-map:hover { background: #d8e7fb; }
    .event-map svg { stroke: var(--accent); }

    .event-time-block {
      flex-shrink: 0;
      min-width: 68px;
      padding-top: 2px;
    }

    .event-time {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text);
      letter-spacing: -0.01em;
      line-height: 1.2;
    }

    .event-time-end {
      font-size: 0.78rem;
      color: var(--text-tertiary);
      margin-top: 2px;
    }

    .event.all-day .event-time {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--accent);
    }

    .event-body {
      flex: 1;
      min-width: 0;
      border-left: 1px solid var(--divider);
      padding-left: 1rem;
    }

    .event-title {
      font-size: 1.02rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--text);
      line-height: 1.35;
    }

    .event-meta {
      font-size: 0.82rem;
      color: var(--text-secondary);
      margin-top: 0.3rem;
      line-height: 1.4;
    }

    .empty {
      text-align: center;
      padding: 3.5rem 1.5rem;
      color: var(--text-tertiary);
    }

    .empty-icon {
      font-size: 2.25rem;
      margin-bottom: 0.6rem;
      opacity: 0.4;
    }

    .empty-text {
      font-size: 1rem;
      font-weight: 500;
      color: var(--text-secondary);
    }

    .loading {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 4rem 0;
      color: var(--text-tertiary);
    }

    .spinner {
      width: 22px;
      height: 22px;
      border: 2px solid var(--divider);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .error-box {
      background: var(--surface);
      border-radius: 14px;
      padding: 1.5rem;
      text-align: center;
      box-shadow: var(--shadow);
      color: #b91c1c;
    }

    .error-box strong {
      display: block;
      margin-bottom: 0.4rem;
      font-size: 1rem;
      color: var(--text);
    }

    .collage {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      overflow-y: hidden;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
      margin: 0 -1.25rem 2rem;
      padding: 4px 1.25rem 10px;
      scrollbar-width: none;
      opacity: 0;
      transition: opacity 0.5s ease;
    }

    .collage::-webkit-scrollbar { display: none; }
    .collage.loaded { opacity: 1; }

    .collage > .tile {
      flex: 0 0 230px;
      height: 170px;
      position: relative;
      border-radius: 16px;
      overflow: hidden;
      background: #e8e8ed;
      scroll-snap-align: start;
      box-shadow: var(--shadow);
      cursor: pointer;
    }

    .collage > .tile:active img { transform: scale(0.98); }

    .collage img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.5s ease;
    }

    .collage .tile:hover img { transform: scale(1.05); }

    .collage .caption {
      position: absolute;
      left: 10px;
      bottom: 8px;
      color: #fff;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.01em;
      text-shadow: 0 1px 4px rgba(0,0,0,0.6);
      opacity: 0.9;
    }

    .collage .tile::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.35) 0%, rgba(0,0,0,0) 45%);
      pointer-events: none;
    }

    @media (max-width: 540px) {
      body { padding: 1.25rem 1rem 3rem; }
      .day-title { font-size: 2.1rem; }
      .tab { min-width: 58px; padding: 0.6rem 0.4rem 0.5rem; }
      .event { padding: 0.95rem 1rem; }
      .event-time-block { min-width: 58px; }
      .collage { height: 180px; }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="brand">Goings On</div>
  <div id="app">
    <div class="loading"><div class="spinner"></div></div>
  </div>
</div>

<script>
  const CALENDAR_ID = '1d79153a3e99e53af1c993acfbf2b3f120c5d78d210297c80de3581d5e924f71@group.calendar.google.com';
  const API_KEY    = 'AIzaSyDsFFei306aI99bm8ppYuzXpEgtzfVyGZY';

  const DAYS_SHORT = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const DAYS_LONG  = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const MONTHS     = ['January','February','March','April','May','June','July','August','September','October','November','December'];

  function dayKey(d) { return `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`; }

  function fmtTime(iso) {
    const d = new Date(iso);
    let h = d.getHours(), m = d.getMinutes();
    const ampm = h >= 12 ? 'PM' : 'AM';
    h = h % 12 || 12;
    return m === 0 ? `${h} ${ampm}` : `${h}:${String(m).padStart(2,'0')} ${ampm}`;
  }

  function relativeLabel(i) {
    if (i === 0) return 'Today';
    if (i === 1) return 'Tomorrow';
    return null;
  }

  const wikiImageCache = {};
  const wikiSearchCache = {};

  async function fetchWikiImage(page) {
    if (wikiImageCache[page] !== undefined) return wikiImageCache[page];
    try {
      const res = await fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(page)}`);
      if (!res.ok) { wikiImageCache[page] = null; return null; }
      const data = await res.json();
      const src = data.originalimage?.source || data.thumbnail?.source || null;
      wikiImageCache[page] = src;
      return src;
    } catch {
      wikiImageCache[page] = null;
      return null;
    }
  }

  async function searchWikiImage(query) {
    const q = (query || '').trim();
    if (!q) return null;
    if (wikiSearchCache[q] !== undefined) return wikiSearchCache[q];
    try {
      const url = `https://en.wikipedia.org/w/api.php?action=opensearch&search=${encodeURIComponent(q)}&limit=1&namespace=0&format=json&origin=*`;
      const res = await fetch(url);
      const data = await res.json();
      const title = data?.[1]?.[0];
      if (!title) { wikiSearchCache[q] = null; return null; }
      const img = await fetchWikiImage(title);
      wikiSearchCache[q] = img;
      return img;
    } catch {
      wikiSearchCache[q] = null;
      return null;
    }
  }

  function cleanLocation(loc) {
    if (!loc) return '';
    return loc.split(',')[0].replace(/^\d+\s+/, '').trim();
  }

  function searchQueryForEvent(ev) {
    const cleanedLoc = cleanLocation(ev.location);
    const base = cleanedLoc || ev.summary || '';
    if (!base) return '';
    const phillyHint = /phil(adelphia|ly)?|penn|liberty|rittenhouse|fishtown|fairmount|citizen[s]? bank|temple|drexel|wissahickon|reading terminal|love park|boathouse|rocky|south street|old city/i;
    return phillyHint.test(base) ? base : `${base} Philadelphia`;
  }

  async function findImageForEvent(ev) {
    const cleanedLoc = cleanLocation(ev.location);
    if (cleanedLoc) {
      const src = await searchWikiImage(searchQueryForEvent(ev));
      if (src) return { src, caption: cleanedLoc };
    }
    if (ev.summary) {
      const titleQuery = /phil(adelphia|ly)?/i.test(ev.summary) ? ev.summary : `${ev.summary} Philadelphia`;
      const src = await searchWikiImage(titleQuery);
      if (src) return { src, caption: ev.summary };
    }
    return null;
  }

  async function renderCollage(container, events) {
    if (events.length === 0) return;

    const resolved = await Promise.all(
      events.map(async (ev, i) => {
        const r = await findImageForEvent(ev);
        return r ? { eventIdx: i, src: r.src, caption: r.caption } : null;
      })
    );

    const tiles = resolved.filter(Boolean);
    if (tiles.length === 0) return;

    container.innerHTML = tiles.map(t => `
      <div class="tile" data-event-idx="${t.eventIdx}">
        <img src="${escapeAttr(t.src)}" alt="${escapeAttr(t.caption)}" loading="lazy">
        <div class="caption">${escapeHtml(t.caption).slice(0, 48)}</div>
      </div>
    `).join('');

    container.querySelectorAll('.tile').forEach(tile => {
      tile.addEventListener('click', () => highlightEvent(tile.dataset.eventIdx));
    });

    const firstImg = container.querySelector('img');
    if (firstImg) {
      if (firstImg.complete) container.classList.add('loaded');
      else firstImg.addEventListener('load', () => container.classList.add('loaded'), { once: true });
    } else {
      container.classList.add('loaded');
    }
  }

  function highlightEvent(idx) {
    const card = document.querySelector(`.event[data-event-idx="${idx}"]`);
    if (!card) return;
    card.scrollIntoView({ behavior: 'smooth', block: 'center' });
    card.classList.remove('highlight');
    void card.offsetWidth;
    card.classList.add('highlight');
    setTimeout(() => card.classList.remove('highlight'), 2200);
  }

  function mapUrl(location) {
    return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(location)}`;
  }

  function escapeAttr(s) { return escapeHtml(s); }

  async function init() {
    const today = new Date();
    today.setHours(0, 0, 0, 0);

    const days = Array.from({ length: 7 }, (_, i) => {
      const d = new Date(today);
      d.setDate(d.getDate() + i);
      return d;
    });

    const timeMin = today.toISOString();
    const endDay  = new Date(days[6]); endDay.setDate(endDay.getDate() + 1);
    const timeMax = endDay.toISOString();

    const url = `https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(CALENDAR_ID)}/events`
      + `?key=${API_KEY}&timeMin=${timeMin}&timeMax=${timeMax}&singleEvents=true&orderBy=startTime`;

    let events;
    try {
      const res  = await fetch(url);
      const json = await res.json();
      if (!res.ok) throw new Error(json.error?.message || `HTTP ${res.status}`);
      events = json.items || [];
    } catch (err) {
      document.getElementById('app').innerHTML =
        `<div class="error-box"><strong>Couldn't load events</strong>${err.message}</div>`;
      return;
    }

    const byDay = {};
    days.forEach(d => { byDay[dayKey(d)] = []; });

    events.forEach(ev => {
      const isAllDay = !ev.start.dateTime;
      const start = parseEventDate(ev.start);
      const end   = parseEventDate(ev.end);

      if (isAllDay) {
        // All-day end is exclusive (next day after last day). Add to every day it covers.
        const cursor = new Date(start);
        cursor.setHours(0, 0, 0, 0);
        while (cursor < end) {
          const k = dayKey(cursor);
          if (byDay[k]) byDay[k].push(ev);
          cursor.setDate(cursor.getDate() + 1);
        }
      } else {
        const k = dayKey(start);
        if (byDay[k]) byDay[k].push(ev);
      }
    });

    // Sort within each day: all-day first, then by start time
    Object.values(byDay).forEach(arr => {
      arr.sort((a, b) => {
        const aAll = !a.start.dateTime, bAll = !b.start.dateTime;
        if (aAll !== bAll) return aAll ? -1 : 1;
        if (aAll) return 0;
        return new Date(a.start.dateTime) - new Date(b.start.dateTime);
      });
    });

    render(days, byDay, 0);
  }

  function parseEventDate(endpoint) {
    // dateTime: full ISO, parse normally. date: YYYY-MM-DD, parse as LOCAL midnight.
    if (endpoint.dateTime) return new Date(endpoint.dateTime);
    const [y, m, d] = endpoint.date.split('-').map(Number);
    return new Date(y, m - 1, d);
  }

  function render(days, byDay, activeIdx) {
    const app = document.getElementById('app');
    app.innerHTML = '';

    const tabs = document.createElement('div');
    tabs.className = 'tabs';

    days.forEach((day, i) => {
      const count = byDay[dayKey(day)].length;
      const btn = document.createElement('button');
      btn.className = 'tab' + (i === activeIdx ? ' active' : '') + (count === 0 ? ' no-events' : '');
      btn.innerHTML = `
        <div class="tab-day">${DAYS_SHORT[day.getDay()]}</div>
        <div class="tab-num">${day.getDate()}</div>
        <div class="tab-badge">${count === 0 ? '—' : count + (count === 1 ? ' event' : ' events')}</div>
      `;
      btn.onclick = () => render(days, byDay, i);
      tabs.appendChild(btn);
    });

    app.appendChild(tabs);

    const panel = document.createElement('div');
    panel.className = 'day-panel';

    const activeDay = days[activeIdx];
    const evs = byDay[dayKey(activeDay)];
    const eyebrow = relativeLabel(activeIdx);

    panel.innerHTML = `
      <div class="collage" id="collage"></div>
      <div class="day-heading">
        ${eyebrow ? `<div class="day-eyebrow">${eyebrow}</div>` : ''}
        <div class="day-title">${DAYS_LONG[activeDay.getDay()]}</div>
        <div class="day-subtitle">${MONTHS[activeDay.getMonth()]} ${activeDay.getDate()}</div>
      </div>
      ${evs.length ? `<div class="events-list">${evs.map((ev, i) => eventHTML(ev, i)).join('')}</div>`
                   : `<div class="empty"><div class="empty-icon">·</div><div class="empty-text">Nothing scheduled</div></div>`}
    `;

    app.appendChild(panel);

    renderCollage(panel.querySelector('#collage'), evs);
  }

  function eventHTML(ev, idx) {
    const allDay = !ev.start.dateTime;
    const timeLabel = allDay ? 'All day' : fmtTime(ev.start.dateTime);
    const endLabel = (!allDay && ev.end?.dateTime) ? fmtTime(ev.end.dateTime) : '';
    const loc  = ev.location ? `<div class="event-meta">${escapeHtml(ev.location)}</div>` : '';
    const desc = ev.description ? `<div class="event-meta">${escapeHtml(stripTags(ev.description)).slice(0, 140)}</div>` : '';
    const mapBtn = ev.location ? `
      <a class="event-map" href="${escapeAttr(mapUrl(ev.location))}" target="_blank" rel="noopener">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
          <circle cx="12" cy="10" r="3"/>
        </svg>
        View on map
      </a>` : '';

    return `
      <div class="event${allDay ? ' all-day' : ''}" data-event-idx="${idx}">
        <div class="event-time-block">
          <div class="event-time">${timeLabel}</div>
          ${endLabel ? `<div class="event-time-end">to ${endLabel}</div>` : ''}
        </div>
        <div class="event-body">
          <div class="event-title">${escapeHtml(ev.summary || '(No title)')}</div>
          ${loc}${desc}${mapBtn}
        </div>
      </div>`;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }

  function stripTags(s) { return String(s).replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim(); }

  init();
</script>

</body>
</html>
