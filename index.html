<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Goings On</title>
  <style>
    :root {
      --bg: #f5f5f7;
      --surface: #ffffff;
      --text: #1d1d1f;
      --text-secondary: #86868b;
      --text-tertiary: #a1a1a6;
      --accent: #0071e3;
      --accent-soft: #e8f1fd;
      --divider: rgba(0, 0, 0, 0.08);
      --shadow: 0 1px 3px rgba(0,0,0,0.04), 0 8px 24px rgba(0,0,0,0.04);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      font-feature-settings: 'kern', 'liga';
    }

    body {
      min-height: 100vh;
      padding: 2rem 1.25rem 4rem;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 720px;
    }

    .brand {
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--text-secondary);
      margin-bottom: 2.5rem;
      text-align: center;
    }

    .tabs {
      display: flex;
      gap: 0.4rem;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      padding: 0.25rem 0 1rem;
      margin: 0 -0.25rem 2rem;
      scrollbar-width: none;
    }
    .tabs::-webkit-scrollbar { display: none; }

    .tab {
      flex: 1 0 auto;
      min-width: 64px;
      background: var(--surface);
      border: none;
      border-radius: 14px;
      padding: 0.7rem 0.5rem 0.6rem;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      font-family: inherit;
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.03);
    }

    .tab:hover { transform: translateY(-1px); }

    .tab.active {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 4px 14px rgba(0, 113, 227, 0.32);
    }

    .tab-day {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--text-secondary);
    }

    .tab.active .tab-day { color: rgba(255,255,255,0.85); }

    .tab-num {
      font-size: 1.15rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .tab-badge {
      font-size: 0.62rem;
      font-weight: 600;
      color: var(--accent);
      margin-top: 1px;
    }
    .tab.active .tab-badge { color: rgba(255,255,255,0.85); }
    .tab.no-events .tab-badge { color: var(--text-tertiary); }

    .day-panel {
      animation: fadeIn 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .day-heading {
      margin-bottom: 1.75rem;
    }

    .day-eyebrow {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--accent);
      letter-spacing: -0.01em;
      margin-bottom: 0.3rem;
    }

    .day-title {
      font-size: 2.5rem;
      font-weight: 700;
      letter-spacing: -0.035em;
      line-height: 1.05;
      color: var(--text);
    }

    .day-subtitle {
      font-size: 1.1rem;
      font-weight: 500;
      color: var(--text-secondary);
      letter-spacing: -0.01em;
      margin-top: 0.35rem;
    }

    .events-list {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .event {
      background: var(--surface);
      border-radius: 16px;
      padding: 1.05rem 1.2rem;
      box-shadow: var(--shadow);
      display: flex;
      align-items: flex-start;
      gap: 1rem;
      transition: transform 0.15s ease;
    }

    .event:hover { transform: scale(1.005); }

    .event-time-block {
      flex-shrink: 0;
      min-width: 68px;
      padding-top: 2px;
    }

    .event-time {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text);
      letter-spacing: -0.01em;
      line-height: 1.2;
    }

    .event-time-end {
      font-size: 0.78rem;
      color: var(--text-tertiary);
      margin-top: 2px;
    }

    .event.all-day .event-time {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--accent);
    }

    .event-body {
      flex: 1;
      min-width: 0;
      border-left: 1px solid var(--divider);
      padding-left: 1rem;
    }

    .event-title {
      font-size: 1.02rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--text);
      line-height: 1.35;
    }

    .event-meta {
      font-size: 0.82rem;
      color: var(--text-secondary);
      margin-top: 0.3rem;
      line-height: 1.4;
    }

    .empty {
      text-align: center;
      padding: 3.5rem 1.5rem;
      color: var(--text-tertiary);
    }

    .empty-icon {
      font-size: 2.25rem;
      margin-bottom: 0.6rem;
      opacity: 0.4;
    }

    .empty-text {
      font-size: 1rem;
      font-weight: 500;
      color: var(--text-secondary);
    }

    .loading {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 4rem 0;
      color: var(--text-tertiary);
    }

    .spinner {
      width: 22px;
      height: 22px;
      border: 2px solid var(--divider);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .error-box {
      background: var(--surface);
      border-radius: 14px;
      padding: 1.5rem;
      text-align: center;
      box-shadow: var(--shadow);
      color: #b91c1c;
    }

    .error-box strong {
      display: block;
      margin-bottom: 0.4rem;
      font-size: 1rem;
      color: var(--text);
    }

    @media (max-width: 540px) {
      body { padding: 1.25rem 1rem 3rem; }
      .day-title { font-size: 2.1rem; }
      .tab { min-width: 58px; padding: 0.6rem 0.4rem 0.5rem; }
      .event { padding: 0.95rem 1rem; }
      .event-time-block { min-width: 58px; }
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #000000;
        --surface: #1c1c1e;
        --text: #f5f5f7;
        --text-secondary: #98989d;
        --text-tertiary: #6e6e73;
        --accent: #0a84ff;
        --accent-soft: #1c2733;
        --divider: rgba(255, 255, 255, 0.08);
        --shadow: 0 1px 3px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.25);
      }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="brand">Goings On</div>
  <div id="app">
    <div class="loading"><div class="spinner"></div></div>
  </div>
</div>

<script>
  const CALENDAR_ID = '1d79153a3e99e53af1c993acfbf2b3f120c5d78d210297c80de3581d5e924f71@group.calendar.google.com';
  const API_KEY    = 'AIzaSyDsFFei306aI99bm8ppYuzXpEgtzfVyGZY';

  const DAYS_SHORT = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const DAYS_LONG  = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const MONTHS     = ['January','February','March','April','May','June','July','August','September','October','November','December'];

  function dayKey(d) { return `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`; }

  function fmtTime(iso) {
    const d = new Date(iso);
    let h = d.getHours(), m = d.getMinutes();
    const ampm = h >= 12 ? 'PM' : 'AM';
    h = h % 12 || 12;
    return m === 0 ? `${h} ${ampm}` : `${h}:${String(m).padStart(2,'0')} ${ampm}`;
  }

  function relativeLabel(i) {
    if (i === 0) return 'Today';
    if (i === 1) return 'Tomorrow';
    return null;
  }

  async function init() {
    const today = new Date();
    today.setHours(0, 0, 0, 0);

    const days = Array.from({ length: 7 }, (_, i) => {
      const d = new Date(today);
      d.setDate(d.getDate() + i);
      return d;
    });

    const timeMin = today.toISOString();
    const endDay  = new Date(days[6]); endDay.setDate(endDay.getDate() + 1);
    const timeMax = endDay.toISOString();

    const url = `https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(CALENDAR_ID)}/events`
      + `?key=${API_KEY}&timeMin=${timeMin}&timeMax=${timeMax}&singleEvents=true&orderBy=startTime`;

    let events;
    try {
      const res  = await fetch(url);
      const json = await res.json();
      if (!res.ok) throw new Error(json.error?.message || `HTTP ${res.status}`);
      events = json.items || [];
    } catch (err) {
      document.getElementById('app').innerHTML =
        `<div class="error-box"><strong>Couldn't load events</strong>${err.message}</div>`;
      return;
    }

    const byDay = {};
    days.forEach(d => { byDay[dayKey(d)] = []; });
    events.forEach(ev => {
      const start = ev.start.dateTime || ev.start.date;
      const k = dayKey(new Date(start));
      if (byDay[k]) byDay[k].push(ev);
    });

    render(days, byDay, 0);
  }

  function render(days, byDay, activeIdx) {
    const app = document.getElementById('app');
    app.innerHTML = '';

    const tabs = document.createElement('div');
    tabs.className = 'tabs';

    days.forEach((day, i) => {
      const count = byDay[dayKey(day)].length;
      const btn = document.createElement('button');
      btn.className = 'tab' + (i === activeIdx ? ' active' : '') + (count === 0 ? ' no-events' : '');
      btn.innerHTML = `
        <div class="tab-day">${DAYS_SHORT[day.getDay()]}</div>
        <div class="tab-num">${day.getDate()}</div>
        <div class="tab-badge">${count === 0 ? '—' : count + (count === 1 ? ' event' : ' events')}</div>
      `;
      btn.onclick = () => render(days, byDay, i);
      tabs.appendChild(btn);
    });

    app.appendChild(tabs);

    const panel = document.createElement('div');
    panel.className = 'day-panel';

    const activeDay = days[activeIdx];
    const evs = byDay[dayKey(activeDay)];
    const eyebrow = relativeLabel(activeIdx);

    panel.innerHTML = `
      <div class="day-heading">
        ${eyebrow ? `<div class="day-eyebrow">${eyebrow}</div>` : ''}
        <div class="day-title">${DAYS_LONG[activeDay.getDay()]}</div>
        <div class="day-subtitle">${MONTHS[activeDay.getMonth()]} ${activeDay.getDate()}</div>
      </div>
      ${evs.length ? `<div class="events-list">${evs.map(eventHTML).join('')}</div>`
                   : `<div class="empty"><div class="empty-icon">·</div><div class="empty-text">Nothing scheduled</div></div>`}
    `;

    app.appendChild(panel);
  }

  function eventHTML(ev) {
    const allDay = !ev.start.dateTime;
    const timeLabel = allDay ? 'All day' : fmtTime(ev.start.dateTime);
    const endLabel = (!allDay && ev.end?.dateTime) ? fmtTime(ev.end.dateTime) : '';
    const loc  = ev.location ? `<div class="event-meta">${escapeHtml(ev.location)}</div>` : '';
    const desc = ev.description ? `<div class="event-meta">${escapeHtml(stripTags(ev.description)).slice(0, 140)}</div>` : '';

    return `
      <div class="event${allDay ? ' all-day' : ''}">
        <div class="event-time-block">
          <div class="event-time">${timeLabel}</div>
          ${endLabel ? `<div class="event-time-end">to ${endLabel}</div>` : ''}
        </div>
        <div class="event-body">
          <div class="event-title">${escapeHtml(ev.summary || '(No title)')}</div>
          ${loc}${desc}
        </div>
      </div>`;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }

  function stripTags(s) { return String(s).replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim(); }

  init();
</script>

</body>
</html>
