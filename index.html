<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Goings On</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f0f2f5;
      color: #222;
      min-height: 100vh;
    }

    header {
      background: #fff;
      border-bottom: 1px solid #e0e0e0;
      padding: 1.1rem 1.5rem;
      display: flex;
      align-items: baseline;
      gap: 0.75rem;
    }

    header h1 {
      font-size: 1.4rem;
      font-weight: 700;
      color: #1a1a2e;
      letter-spacing: -0.02em;
    }

    header .subtitle {
      font-size: 0.85rem;
      color: #888;
    }

    .calendar {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 1px;
      background: #d8dce3;
      margin: 1.25rem;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .day-col {
      background: #fff;
      min-height: 420px;
      display: flex;
      flex-direction: column;
    }

    .day-header {
      padding: 0.7rem 0.9rem 0.6rem;
      border-bottom: 1px solid #f0f0f0;
    }

    .day-col.today .day-header {
      background: #2563eb;
    }

    .day-name {
      font-size: 0.68rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: #999;
    }

    .day-col.today .day-name { color: rgba(255,255,255,0.75); }

    .day-num {
      font-size: 1.6rem;
      font-weight: 700;
      color: #1a1a2e;
      line-height: 1.15;
    }

    .day-col.today .day-num { color: #fff; }

    .day-month {
      font-size: 0.72rem;
      color: #aaa;
      margin-top: 1px;
    }

    .day-col.today .day-month { color: rgba(255,255,255,0.65); }

    .events {
      padding: 0.5rem;
      flex: 1;
    }

    .event {
      background: #eff6ff;
      border-left: 3px solid #2563eb;
      border-radius: 5px;
      padding: 0.35rem 0.5rem;
      margin-bottom: 0.35rem;
      cursor: default;
    }

    .event.all-day {
      background: #f0fdf4;
      border-left-color: #16a34a;
    }

    .event-time {
      font-size: 0.68rem;
      color: #666;
      font-weight: 500;
    }

    .event-title {
      font-size: 0.78rem;
      font-weight: 500;
      color: #1a1a2e;
      line-height: 1.3;
      margin-top: 1px;
    }

    .no-events {
      font-size: 0.72rem;
      color: #ccc;
      text-align: center;
      padding: 1rem 0.5rem;
    }

    #loading {
      text-align: center;
      padding: 4rem 2rem;
      color: #888;
      font-size: 0.95rem;
    }

    .spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 2px solid #ddd;
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 0.5rem;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .error-box {
      margin: 1.25rem;
      padding: 1.25rem 1.5rem;
      background: #fff5f5;
      border: 1px solid #fecaca;
      border-radius: 8px;
      color: #b91c1c;
      font-size: 0.9rem;
    }

    .error-box strong { display: block; margin-bottom: 0.25rem; }

    @media (max-width: 860px) {
      .calendar {
        grid-template-columns: repeat(4, 1fr);
        margin: 0.75rem;
      }
    }

    @media (max-width: 540px) {
      .calendar {
        grid-template-columns: 1fr 1fr;
      }
      .day-col { min-height: 180px; }
    }

    @media (max-width: 340px) {
      .calendar { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<header>
  <h1>Goings On</h1>
  <span class="subtitle" id="date-range"></span>
</header>

<div id="app">
  <div id="loading"><span class="spinner"></span>Loading events…</div>
</div>

<script>
  const CALENDAR_ID = '1d79153a3e99e53af1c993acfbf2b3f120c5d78d210297c80de3581d5e924f71@group.calendar.google.com';
  const API_KEY    = 'AIzaSyDsFFei306aI99bm8ppYuzXpEgtzfVyGZY';

  const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const DAYS   = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

  function dayKey(d) {
    return `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
  }

  function fmtTime(iso) {
    const d = new Date(iso);
    let h = d.getHours(), m = d.getMinutes();
    const ampm = h >= 12 ? 'pm' : 'am';
    h = h % 12 || 12;
    return m === 0 ? `${h}${ampm}` : `${h}:${String(m).padStart(2,'0')}${ampm}`;
  }

  function fmtShortDate(d) {
    return `${MONTHS[d.getMonth()]} ${d.getDate()}`;
  }

  async function init() {
    const today = new Date();
    today.setHours(0, 0, 0, 0);

    const days = Array.from({ length: 7 }, (_, i) => {
      const d = new Date(today);
      d.setDate(d.getDate() + i);
      return d;
    });

    document.getElementById('date-range').textContent =
      `${fmtShortDate(days[0])} – ${fmtShortDate(days[6])}`;

    const timeMin = today.toISOString();
    const endDay  = new Date(days[6]); endDay.setDate(endDay.getDate() + 1);
    const timeMax = endDay.toISOString();

    const url = `https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(CALENDAR_ID)}/events`
      + `?key=${API_KEY}&timeMin=${timeMin}&timeMax=${timeMax}&singleEvents=true&orderBy=startTime`;

    let events;
    try {
      const res = await fetch(url);
      const json = await res.json();
      if (!res.ok) throw new Error(json.error?.message || `HTTP ${res.status}`);
      events = json.items || [];
    } catch (err) {
      document.getElementById('app').innerHTML =
        `<div class="error-box"><strong>Could not load events</strong>${err.message}</div>`;
      return;
    }

    const byDay = {};
    days.forEach(d => { byDay[dayKey(d)] = []; });
    events.forEach(ev => {
      const start = ev.start.dateTime || ev.start.date;
      const k = dayKey(new Date(start));
      if (byDay[k]) byDay[k].push(ev);
    });

    const grid = document.createElement('div');
    grid.className = 'calendar';

    days.forEach((day, i) => {
      const evs = byDay[dayKey(day)];
      const col = document.createElement('div');
      col.className = 'day-col' + (i === 0 ? ' today' : '');

      const evHTML = evs.length
        ? evs.map(ev => {
            const allDay = !ev.start.dateTime;
            const time   = allDay ? 'All day' : fmtTime(ev.start.dateTime);
            return `<div class="event${allDay ? ' all-day' : ''}">
              <div class="event-time">${time}</div>
              <div class="event-title">${ev.summary || '(No title)'}</div>
            </div>`;
          }).join('')
        : '<div class="no-events">No events</div>';

      col.innerHTML = `
        <div class="day-header">
          <div class="day-name">${DAYS[day.getDay()]}</div>
          <div class="day-num">${day.getDate()}</div>
          <div class="day-month">${MONTHS[day.getMonth()]}</div>
        </div>
        <div class="events">${evHTML}</div>`;

      grid.appendChild(col);
    });

    const app = document.getElementById('app');
    app.innerHTML = '';
    app.appendChild(grid);
  }

  init();
</script>
</body>
</html>
