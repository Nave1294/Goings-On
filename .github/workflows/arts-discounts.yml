name: Refresh Performing-Arts Discount Rules

on:
  schedule:
    # Quarterly: 09:00 UTC on the 1st of Jan, Apr, Jul, Oct
    - cron: '0 9 1 1,4,7,10 *'
  workflow_dispatch:
    # Allow manual runs from the Actions tab

# Serialize against the other workflows that edit index.html so their pushes
# never race each other.
concurrency:
  group: edit-index-html
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Re-verify discount-ticket rules
        run: node scripts/update-arts-discounts.js
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: refresh performing-arts discount rules [skip ci]"
            git pull --rebase origin main
            git push
          fi
