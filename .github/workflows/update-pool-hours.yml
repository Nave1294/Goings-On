name: Update Public-Pool Hours

on:
  schedule:
    # Weekly during pool season (May–Sep): 12:00 UTC every Monday.
    # Off-season the job simply finds nothing new; the tab is hidden anyway.
    - cron: '0 12 * 5,6,7,8,9 1'
  workflow_dispatch:
    # Allow manual runs from the Actions tab

# Serialize against the other workflows that edit index.html so their pushes
# never race each other.
concurrency:
  group: edit-index-html
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Refresh pool hours from Parks & Rec
        run: node scripts/update-pool-hours.js
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update public-pool hours [skip ci]"
            git pull --rebase origin main
            git push
          fi
