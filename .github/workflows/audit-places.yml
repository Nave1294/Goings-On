name: Quarterly Places Audit

on:
  schedule:
    # 1st of January, April, July, October at 11 AM UTC
    - cron: '0 11 1 1,4,7,10 *'
  workflow_dispatch:
    # Allow manual runs from the Actions tab (main branch only)

jobs:
  audit:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run places audit
        run: node scripts/audit-places.js
        env:
          PLACES_API_KEY: ${{ secrets.PLACES_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add index.html

          # Build commit subject + body from the audit summary
          if [ -f .audit-summary.json ]; then
            DATE=$(node -e "console.log(require('./.audit-summary.json').date)")
            REMOVED=$(node -e "const s=require('./.audit-summary.json'); console.log(s.removed.length ? s.removed.join(', ') : 'none')")
            UPDATED=$(node -e "const s=require('./.audit-summary.json'); console.log(s.updated.length ? s.updated.join(', ') : 'none')")
            LOCATED=$(node -e "const s=require('./.audit-summary.json'); console.log((s.located||[]).length ? s.located.join(', ') : 'none')")
            NOT_FOUND=$(node -e "const s=require('./.audit-summary.json'); console.log(s.notFound.length ? s.notFound.join(', ') : 'none')")
            SUBJECT="chore: quarterly places audit ${DATE} [skip ci]"
            BODY="Removed (closed): ${REMOVED} | Updated (changed): ${UPDATED} | Located (filled): ${LOCATED} | Not found: ${NOT_FOUND}"
          else
            SUBJECT="chore: quarterly places audit [skip ci]"
            BODY=""
          fi
          rm -f .audit-summary.json

          if git diff --staged --quiet; then
            echo "No changes — all places still current"
          else
            git commit -m "$SUBJECT" -m "$BODY"
            git push
          fi
