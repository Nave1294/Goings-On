name: Quarterly Places Audit

on:
  schedule:
    # 1st of January, April, July, October at 11 AM UTC
    - cron: '0 11 1 1,4,7,10 *'
  workflow_dispatch:
    # Allow manual runs from the Actions tab

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run places audit
        run: node scripts/audit-places.js
        env:
          PLACES_API_KEY: ${{ secrets.PLACES_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Build commit message from the audit summary
          if [ -f .audit-summary.json ]; then
            DATE=$(node -e "console.log(require('./.audit-summary.json').date)")
            REMOVED=$(node -e "const s=require('./.audit-summary.json'); console.log(s.removed.length ? s.removed.join(', ') : 'none')")
            UPDATED=$(node -e "const s=require('./.audit-summary.json'); console.log(s.updated.length ? s.updated.join(', ') : 'none')")
            NOT_FOUND=$(node -e "const s=require('./.audit-summary.json'); console.log(s.notFound.length ? s.notFound.join(', ') : 'none')")
            MSG="chore: quarterly places audit ${DATE}

Removed (closed): ${REMOVED}
Updated (changed): ${UPDATED}
Not found: ${NOT_FOUND}

[skip ci]"
          else
            MSG="chore: quarterly places audit [skip ci]"
          fi

          # Stage index.html and remove the temp summary file
          git add index.html
          git rm --cached .audit-summary.json 2>/dev/null || true
          rm -f .audit-summary.json

          git diff --staged --quiet \
            && echo "No changes — all places still current" \
            || git commit -m "$MSG"
          git push
